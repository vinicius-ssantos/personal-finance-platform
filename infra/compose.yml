name: personal-finance-local

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: personal_finance
      POSTGRES_USER: personal_finance_local
      POSTGRES_PASSWORD: personal_finance_local_only
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - personal_finance_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U personal_finance_local -d personal_finance
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  personal_finance_postgres:
    name: personal-finance-local-postgres
