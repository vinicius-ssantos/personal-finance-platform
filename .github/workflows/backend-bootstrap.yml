name: Backend Bootstrap

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-bootstrap.yml"
      - "justfile"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-bootstrap.yml"
      - "justfile"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: backend-bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, static analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run backend checks
        working-directory: backend
        run: bash ./gradlew --no-daemon check
